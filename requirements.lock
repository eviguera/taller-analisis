# versiones que exigen Python >=3.12 (p. ej. numpy 2.5.x), lo que rompe el
# build del contenedor con "No matching distribution found".
# Regeneración fiel:
#   docker run --rm -v "$PWD":/w -w /w python:3.11-slim \
#     sh -c "pip install -r requirements.txt && pip freeze"
